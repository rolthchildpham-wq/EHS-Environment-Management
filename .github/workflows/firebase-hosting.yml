name: Deploy EHS to Firebase Hosting
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'tests/**'
      - 'firebase.json'
      - '.github/workflows/firebase-hosting.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ehs-firebase-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Firebase configuration
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test "$FIREBASE_PROJECT_ID" = "ehs-environment-management" || { echo 'Set repository variable FIREBASE_PROJECT_ID=ehs-environment-management'; exit 1; }
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo 'Missing repository secret FIREBASE_SERVICE_ACCOUNT'; exit 1; }
          node - <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('public/firebase-config.js','utf8');
          const m=raw.match(/window\.EHS_FIREBASE_CONFIG\s*=\s*(\{[\s\S]*?\})\s*;/);
          if(!m)throw Error('Configure public/firebase-config.js using Firebase Web App config');
          const cfg=JSON.parse(m[1]);
          if(cfg.projectId!=='ehs-environment-management'||!cfg.apiKey||!cfg.appId||!cfg.authDomain)throw Error('Incomplete or incorrect EHS Web App config');
          NODE
      - name: Validate website JavaScript
        run: |
          node --check public/app.js
          node --check public/member-admin.js
          node --check public/ehs-operations.js
          node --check public/ehs-excel-adapters.js
          node --check public/ehs-ocr.js
          node --check public/ehs-financial-reconcile.js
          node --check public/i18n.js
          node --check public/data-reset.js
          node --check public/factory-map.js
          node --check public/ehs-compliance.js
          node --check public/source-terms.js
          node --check public/ehs-cost-detail.js
          node --experimental-default-type=module --test tests/ehs-finance.test.mjs
          node --experimental-default-type=module --test tests/ehs-ui.test.mjs
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@14
      - name: Deploy Hosting only
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
          rm -f "$RUNNER_TEMP/firebase-service-account.json"
