name: EHS Hub Preview (no production deploy)
on:
  pull_request:
    paths:
      - 'public/index.html'
      - 'public/app.js'
      - 'public/wwtp/**'
      - 'tests/ehs-wwtp-hub.test.mjs'
      - 'tests/ehs-hub-preview-smoke.mjs'
      - 'tests/ehs-hub-browser-preview.mjs'
      - '.github/workflows/ehs-hub-preview.yml'
concurrency:
  group: ehs-hub-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify EHS/WWTP page routes and authorization contracts
        run: |
          node --check public/app.js
          node --check public/wwtp/ehs-auth-guard.js
          node --test tests/ehs-wwtp-hub.test.mjs
          node --test tests/ehs-ui.test.mjs
          node --test tests/ehs-permissions.test.mjs
      - name: Deploy temporary Firebase Hosting preview only
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CHANNEL_ID: wwtp-hub-pr${{ github.event.pull_request.number }}
        run: |
          test "$FIREBASE_PROJECT_ID" = "ehs-environment-management"
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo 'Firebase service account unavailable: preview not deployed'; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-preview-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-preview-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-preview-account.json"
          trap 'rm -f "$RUNNER_TEMP/firebase-preview-account.json"' EXIT
          npm install -g --no-audit --no-fund firebase-tools@14
          firebase hosting:channel:deploy "$CHANNEL_ID" --expires 2d --project "$FIREBASE_PROJECT_ID" --non-interactive 2>&1 | tee "$RUNNER_TEMP/ehs-hub-preview.log"
          PREVIEW_URL="$(grep -Eo 'https://ehs-environment-management--[a-z0-9-]+\.web\.app' "$RUNNER_TEMP/ehs-hub-preview.log" | tail -n1)"
          test -n "$PREVIEW_URL" || { echo 'Preview URL missing'; exit 1; }
          echo "EHS_PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "Preview ready: $PREVIEW_URL"
      - name: Verify routes served by deployed Firebase Hosting preview
        run: node tests/ehs-hub-preview-smoke.mjs
      - name: Install browser for visual layout test
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN" || { echo 'System Chromium/Chrome unavailable on runner'; exit 1; }
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Desktop and mobile browser smoke on actual preview
        run: node tests/ehs-hub-browser-preview.mjs
      - name: Publish browser screenshots as PR artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ehs-hub-pr-preview-screenshots
          path: tests/artifacts/*.png
          if-no-files-found: ignore

