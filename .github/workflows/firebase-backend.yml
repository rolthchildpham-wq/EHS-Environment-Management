name: Deploy EHS Firestore Rules (Spark)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Firebase target
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test "$FIREBASE_PROJECT_ID" = "ehs-environment-management"
          test -n "$FIREBASE_SERVICE_ACCOUNT"
      - name: Deploy Firestore rules (no Cloud Functions)
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/ehs-sa.json"
          chmod 600 "$RUNNER_TEMP/ehs-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/ehs-sa.json"
          npm install -g firebase-tools@14
          firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive
