name: Deploy EHS Firestore Rules (Spark)
# Rules are published before Hosting in firebase-hosting.yml.
# Manual workflow remains available for authorized recovery.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Firebase target
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test "$FIREBASE_PROJECT_ID" = "ehs-environment-management"
          test -n "$FIREBASE_SERVICE_ACCOUNT"
      - name: Validate Firestore rules structure
        run: node --test tests/firestore-rules.test.mjs
      - name: Deploy Firestore rules via Firebase Rules REST (manual recovery)
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/ehs-sa.json"
          chmod 600 "$RUNNER_TEMP/ehs-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/ehs-sa.json"
          trap 'rm -f "$RUNNER_TEMP/ehs-sa.json"' EXIT
          npm install --no-save --no-audit --no-fund google-auth-library@9
          node scripts/deploy-ehs-rules-rest.mjs
